<div id="library-view">
  <div class="page-header">
    <div class="container">
      <p class="eyebrow">CENTRE D’APPRENTISSAGE</p>
      <h1>Un bon réflexe s’apprend.</h1>
      <p>
        Des cours courts, des exemples concrets et un quiz pour pratiquer. Commencez par les bases
        ou explorez un sujet à votre rythme.
      </p>
    </div>
  </div>
  <section class="page-content">
    <div class="container">
      <div class="filter-row level-tabs" role="group" aria-label="Niveau de formation">
        <button class="filter-btn active" data-level="all" aria-pressed="true" type="button">
          Tous les niveaux</button
        ><button class="filter-btn" data-level="débutant" aria-pressed="false" type="button">
          Débutant</button
        ><button class="filter-btn" data-level="intermédiaire" aria-pressed="false" type="button">
          Intermédiaire</button
        ><button class="filter-btn" data-level="avancé" aria-pressed="false" type="button">
          Avancé
        </button>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <label for="lesson-search" class="sr-only">Rechercher une formation</label
          ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg
          ><input
            id="lesson-search"
            class="search-input"
            type="search"
            placeholder="Un sujet, un mot-clé…"
            maxlength="100"
            autocomplete="off"
          />
        </div>
        <a class="text-link" href="progression.html"
          >Ma progression<svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#arrow"></use></svg
        ></a>
      </div>
      <div class="filter-row category-filters" role="group" aria-label="Catégorie de formation">
        <button class="filter-btn" type="button" data-category="all" aria-pressed="true">
          Toutes les catégories</button
        ><button class="filter-btn" type="button" data-category="bases" aria-pressed="false">
          Fondamentaux</button
        ><button class="filter-btn" type="button" data-category="comptes" aria-pressed="false">
          Comptes</button
        ><button class="filter-btn" type="button" data-category="messagerie" aria-pressed="false">
          Messagerie</button
        ><button class="filter-btn" type="button" data-category="finance" aria-pressed="false">
          Finance</button
        ><button class="filter-btn" type="button" data-category="arnaques" aria-pressed="false">
          Arnaques</button
        ><button class="filter-btn" type="button" data-category="appareils" aria-pressed="false">
          Appareils</button
        ><button class="filter-btn" type="button" data-category="reseaux" aria-pressed="false">
          Réseaux
        </button>
      </div>
      <p id="lesson-count" class="results-count" aria-live="polite"></p>
      <div id="lessons-grid"><p class="status-note">Chargement des cours…</p></div>
    </div>
  </section>
</div>
<div id="lesson-view" hidden></div>
