name: Qualité TchatzSafe
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate
      # `git diff` seul ignore les fichiers non suivis : une page générée mais jamais
      # commitée passerait en CI alors qu’elle manquerait sur le site déployé.
      - run: git add -A -- '*.html' 'sitemap.xml' 'robots.txt' 'assets/icons.svg'
      - name: Vérifier que les fichiers générés sont à jour
        run: git diff --cached --exit-code -- '*.html' 'sitemap.xml' 'robots.txt' 'assets/icons.svg'
      - name: Vérifier qu’aucun artefact généré n’est oublié
        run: test -z "$(git status --porcelain --untracked-files=all -- '*.html' 'sitemap.xml' 'robots.txt' 'assets/icons.svg')"
      - run: npm run check
      - run: npm test
      - name: npm audit (indicatif)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: traces-de-test
          path: test-results/
          retention-days: 7
